name: PomodoroFocus
options:
  bundleIdPrefix: com.focuslab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:
  PomodoroFocus:
    type: application
    platform: iOS
    sources:
      - path: PomodoroFocus
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: PomodoroFocus/Info.plist
      properties:
        CFBundleDisplayName: 番茄专注
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: PomodoroFocus/PomodoroFocus.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuslab.pomodorofocus
        PRODUCT_NAME: PomodoroFocus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: PomodoroWidgetExtension
        embed: true

  PomodoroWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PomodoroWidget
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: PomodoroWidget/Info.plist
      properties:
        CFBundleDisplayName: 番茄专注
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundlePackageType: XPC!
        CFBundleExecutable: $(EXECUTABLE_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuslab.pomodorofocus.widget
        PRODUCT_NAME: PomodoroWidgetExtension
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  PomodoroFocus:
    build:
      targets:
        PomodoroFocus: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
